name: Deploy Books API

on:
  push:
    branches:
      - main

env:
  ACR_NAME: acrbooksapivt2026vm
  IMAGE_NAME: fastapi-books-api
  IMAGE_TAG: v1
  APP_SERVICE_NAME: app-books-api-vt2026vm
  RESOURCE_GROUP: AzureDevelopers-MoringaSchool
  APIM_NAME: apim-books-api-vt2026vm
  API_ID: books-api

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-app:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update App Service with new image
        run: |
          az webapp config container set \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-image-name ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

  deploy-apim:
    name: Import API into APIM
    runs-on: ubuntu-latest
    needs: deploy-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait for App Service to be healthy
        run: sleep 30

      - name: Import API into APIM
        run: |
          az apim api import \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --service-name ${{ env.APIM_NAME }} \
            --api-id ${{ env.API_ID }} \
            --path books \
            --specification-format OpenApi \
            --specification-url https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net/openapi.json
